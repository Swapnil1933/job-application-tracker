services:
  - type: web
    name: job-tracker-api
    env: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        value: mongodb://localhost:27017/job-tracker
