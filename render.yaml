services:
  - type: web
    name: job-tracker-api
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        value: mongodb://localhost:27017/job-tracker
